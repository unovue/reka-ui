# .github/workflows/release.yaml

name: Release

# Each job declares what it needs; nothing is granted workflow-wide.
permissions: {}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The dist-tag is picked from npm's current `latest` right before the publish,
# so two releases must not interleave. Release workflows on every branch share
# this group. `queue: max` keeps every waiting release instead of replacing an
# older pending one, so no version is skipped; runs are never cancelled.
concurrency:
  group: npm-publish
  queue: max

jobs:
  # The whole Build workflow (build, unit, browser, Vapor and size jobs) runs on
  # the tagged commit first. `release` and `npm` both need it, so a failure
  # leaves the tag with no GitHub release and nothing on npm.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # changelogithub creates the GitHub release.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The changelog is built from the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned: this runs with a write token, so it must not float to whatever npm serves.
      - run: npx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      # Built on the Node version the setup action installs, the same one CI
      # builds and tests with.
      - name: Build Packages
        run: pnpm build

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 22 bundles npm 10,
      # Node 26 (the active LTS) bundles npm 11.20, so the publish step runs on
      # Node 26 instead of upgrading npm in place. This comes after the build
      # so the published files are still built on the setup action's Node.
      - name: Use Node 26 for publishing
        uses: actions/setup-node@v7
        with:
          node-version: 26
          # Nothing is installed after this point.
          package-manager-cache: false

      # The package is published from its own directory; the trusted publisher
      # is matched on the repository, this workflow file and the `npm`
      # environment, and `repository.url` in packages/core/package.json.
      # Trusted publishing attaches provenance by itself, so `--provenance` is
      # redundant here; it is kept to state the intent.
      # npm refuses to publish over an existing version, so a rerun after a
      # failure that followed a successful publish skips the publish instead
      # of dying on the 403.
      # The dist-tag comes from packages/core/scripts/npm-dist-tag.mjs, which
      # `pub:release` uses too: a prerelease (3.0.0-alpha.0) goes out under its
      # id (`alpha`), never `latest`, and a stable release goes out as
      # `v<major>-latest` instead of `latest` once a newer major is `latest` on
      # npm. The script fails the step if it can't read npm's `latest`, since an
      # explicit `--tag latest` would overwrite it.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag=$(node packages/core/scripts/npm-dist-tag.mjs "$version")
          echo "Publishing reka-ui@$version under the \`$tag\` dist-tag with npm $(npm --version)"
          if npm view "reka-ui@$version" version >/dev/null 2>&1; then
            echo "reka-ui@$version is already on npm, skipping"
          else
            npm publish ./packages/core --access public --provenance --tag "$tag"
          fi
