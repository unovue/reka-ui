# .github/workflows/release.yml

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 18.x

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Update npm (Trusted Publishers requires npm >= 11.5.1)
        # Workaround for npm/cli#9151: Node 22's bundled npm 10.9.7 is broken
        # (missing promise-retry). Pin to 11.11.0 which installs successfully.
        run: npm install -g npm@11.11.0

      - name: Build Packages
        run: pnpm build

      # Must publish from repo root for provenance to work with OIDC.
      # npm refuses to publish over an existing version, so a rerun after a
      # failure that followed a successful publish skips the publish instead
      # of dying on the 403.
      # A prerelease (3.0.0-alpha.0) goes out under its own dist-tag (`alpha`),
      # never `latest`: npm 11 refuses a prerelease without `--tag`, and before
      # that it would have replaced the stable release for every install.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          # Build metadata (`+build-1`) is not part of the prerelease.
          release=${version%%+*}
          case "$release" in
            *-*)
              prerelease=${release#*-}
              tag=${prerelease%%.*}
              # npm rejects a dist-tag that reads as a semver range (`0`, `v3`, `x`),
              # so only letters are taken; anything else goes to `next`.
              [[ "$tag" =~ ^[a-z]+(-[a-z]+)*$ && ! "$tag" =~ ^(latest|x)$ ]] || tag=next
              ;;
            *) tag=latest ;;
          esac
          if npm view "reka-ui@$version" version >/dev/null 2>&1; then
            echo "reka-ui@$version is already on npm, skipping"
          else
            npm publish ./packages/core --access public --provenance --tag "$tag"
          fi
