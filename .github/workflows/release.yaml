# .github/workflows/release.yml

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 18.x

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Update npm (Trusted Publishers requires npm >= 11.5.1)
        # Workaround for npm/cli#9151: Node 22's bundled npm 10.9.7 is broken
        # (missing promise-retry). Pin to 11.11.0 which installs successfully.
        run: npm install -g npm@11.11.0

      - name: Build Packages
        run: pnpm build

      # Must publish from repo root for provenance to work with OIDC.
      # The dist-tag comes from packages/core/scripts/npm-dist-tag.mjs, which
      # `pub:release` uses too: a prerelease goes out under its id (`beta`), and
      # a stable 2.x goes out as `v2-latest` instead of `latest` once a newer
      # major is `latest` on npm (npm refuses to move `latest` backwards).
      # npm refuses to publish over an existing version, so a rerun after a
      # failure that followed a successful publish skips the publish instead
      # of dying on the 403.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag=$(node packages/core/scripts/npm-dist-tag.mjs "$version")
          echo "Publishing reka-ui@$version under the \`$tag\` dist-tag"
          if npm view "reka-ui@$version" version >/dev/null 2>&1; then
            echo "reka-ui@$version is already on npm, skipping"
          else
            npm publish ./packages/core --access public --provenance --tag "$tag"
          fi
