name: Publish Any Commit (v2)
# `on: [push, pull_request]` ran a same-repo PR twice per push, once for each
# event, building and publishing the same commit both times. Pull requests now
# cover every PR branch (forks included), and push only covers the release
# branches, which have no PR of their own.
on:
  push:
    branches:
      - v2
      - v3
  pull_request:

# pkg-pr-new only reads the checkout; its PR comment is posted by the
# pkg.pr.new GitHub App, not with this token.
permissions:
  contents: read

jobs:
  build:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'docs:')) ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'docs:'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Build Reka UI and plugins
        run: pnpm run build

      - run: pnpm dlx pkg-pr-new publish --compact ./packages/core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
