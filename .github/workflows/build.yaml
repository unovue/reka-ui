name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'

  pull_request:
    paths:
      - 'packages/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm --filter reka-ui build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: reka-ui-dist
          path: packages/core/dist
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Test (with coverage)
        run: pnpm --filter reka-ui test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/core/coverage
          retention-days: 7

  test-browser:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter reka-ui exec playwright install --with-deps chromium

      - name: Test (browser)
        run: pnpm --filter reka-ui test:browser

  # Experimental `reka-ui/vapor` entry: its own suite, compiled in Vapor mode against Vue 3.6.
  test-vapor:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter reka-ui exec playwright install --with-deps chromium

      - name: Test (Vapor build plugins, Node)
        run: pnpm --filter reka-ui test:vapor:node

      - name: Test (Vapor)
        run: pnpm --filter reka-ui test:vapor

      # The same tests against the VDOM components, so a failure that is not Vapor-specific shows up here too
      - name: Test (VDOM parity)
        run: pnpm --filter reka-ui test:vapor
        env:
          VAPOR_PARITY: vdom

      # The published files: the same tests against the built dist/vapor, plus Node-side checks (SSR stub, exports)
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Test (Vapor, built dist)
        run: pnpm --filter reka-ui test:vapor:dist

  # The Carousel rests on native scroll snapping, smooth scrolling and `scrollend`,
  # where Firefox and WebKit differ from Chromium, so its browser tests run in both.
  test-browser-carousel:
    needs: build
    runs-on: ubuntu-latest
    name: test-browser-carousel (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      BROWSER_ENGINES: ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter reka-ui exec playwright install --with-deps ${{ matrix.browser }}

      - name: Test (browser)
        run: pnpm --filter reka-ui test:browser src/Carousel

  size:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Check bundle size
        run: pnpm --filter reka-ui size
