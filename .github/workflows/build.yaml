name: Build

# Root files that change what gets installed, built or tested are listed next to
# `packages/**`, so a lockfile bump or a workflow edit is tested too. Docs-only
# changes stay out: they are covered by the Lint workflow.
on:
  push:
    # The long-lived branches. `main` is no longer developed.
    branches:
      - v2
      - v3
    paths: &paths
      - 'packages/**'
      # Dependency and tooling changes can break the build without touching `packages/`.
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'patches/**'
      - 'docs/scripts/**'
      - eslint.config.mjs
      - '.github/workflows/**'
      - '.github/actions/**'

  pull_request:
    paths: *paths

  # The Release workflow calls this one and publishes only when every job passes.
  workflow_call:

# A new push to a pull request replaces the run in progress. Every other run
# (a push to a branch, a release) gets a group of its own and is never cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      # The whole workspace: reka-ui, then the plugins package, which writes
      # `dist/nuxt`, `dist/resolver` and `dist/namespaced` into packages/core/dist
      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: reka-ui-dist
          path: packages/core/dist
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      # `src/subpaths.test.ts` checks the built entry points against the root barrel
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Test (with coverage)
        run: pnpm --filter reka-ui test:coverage

      # `test-types/strict-templates`: consumer templates with `strictTemplates`, against the built `.d.ts`
      - name: Test (types)
        if: ${{ !cancelled() }}
        run: pnpm --filter reka-ui test:types

      # The resolver and Nuxt module tests import the built `reka-ui/constant` and family entries
      - name: Test (plugins)
        if: ${{ !cancelled() }}
        run: pnpm --filter plugins test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/core/coverage
          retention-days: 7

  test-browser:
    needs: build
    runs-on: ubuntu-latest
    name: test-browser (${{ matrix.browser }})

    # One job per engine, in parallel: Firefox and WebKit differ from Chromium in
    # ways it can't show (focus events for a removed element, key defaults, layout).
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BROWSER_ENGINES: ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter reka-ui exec playwright install --with-deps ${{ matrix.browser }}

      # The built `reka-ui/elements` entry, loaded next to the source as a second
      # copy of the library (src/elements/copies.browser.test.ts).
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Test (browser)
        run: pnpm --filter reka-ui test:browser

  # Experimental `reka-ui/vapor` entry: its own suite, compiled in Vapor mode against Vue 3.6.
  test-vapor:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter reka-ui exec playwright install --with-deps chromium

      - name: Test (Vapor build plugins, Node)
        run: pnpm --filter reka-ui test:vapor:node

      - name: Test (Vapor)
        run: pnpm --filter reka-ui test:vapor

      # The same tests against the VDOM components, so a failure that is not Vapor-specific shows up here too
      - name: Test (VDOM parity)
        run: pnpm --filter reka-ui test:vapor
        env:
          VAPOR_PARITY: vdom

      # The published files: the same tests against the built dist/vapor, plus Node-side checks (SSR stub, exports)
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Test (Vapor, built dist)
        run: pnpm --filter reka-ui test:vapor:dist

  # The package as it would be published: it is packed, then publint and Are The Types Wrong read the
  # tarball, Node loads every entry of `exports` with import(), and a small TypeScript
  # consumer is type-checked against the packed declarations. See packages/core/package-check.
  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Check the published package
        run: pnpm package:check

  size:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: reka-ui-dist
          path: packages/core/dist

      - name: Check bundle size
        run: pnpm --filter reka-ui size
